let current = 0;
let answered = false;

// -------------------
// 음성 읽기
// -------------------

function speak(text){

    speechSynthesis.cancel();

    const utter = new SpeechSynthesisUtterance(text);

    utter.lang="ko-KR";
    utter.rate=0.95;
    utter.pitch=1.0;

    const voices=speechSynthesis.getVoices();

    const ko=voices.find(v=>v.lang.startsWith("ko"));

    if(ko){
        utter.voice=ko;
    }

    speechSynthesis.speak(utter);

}

speechSynthesis.onvoiceschanged=function(){
    speechSynthesis.getVoices();
};

// -------------------
// 랜덤 문제
// -------------------

function randomQuestion(){

    let next;

    do{

        next=Math.floor(Math.random()*questions.length);

    }while(next===current && questions.length>1);

    current=next;

}

// -------------------
// 문제 출력
// -------------------

function showQuestion(){

    document.getElementById("question").innerText=
    questions[current].question;

    document.getElementById("answer").value="";

    document.getElementById("result").innerHTML="";

    answered=false;

    document.getElementById("answer").focus();

    setTimeout(function(){

        speak(questions[current].question);

    },300);

}

// -------------------
// 유사율 계산
// -------------------

function similarity(user,keywords){

    let count=0;

    user=user.replace(/\s/g,"");

    keywords.forEach(function(k){

        if(user.includes(k.replace(/\s/g,""))){

            count++;

        }

    });

    return Math.round(count/keywords.length*100);

}

// -------------------
// 제출
// -------------------

function submit(){

    if(answered) return;

    const user=document.getElementById("answer").value;

    const q=questions[current];

    const score=similarity(user,q.keywords);

    document.getElementById("result").innerHTML=`
        <b>정답</b><br>
        ${q.answer}
        <br><br>
        <b>유사율 : ${score}%</b>
    `;

    answered=true;

    speak("정답은 " + q.answer);

}

// -------------------
// 다음 문제
// -------------------

function next(){

    randomQuestion();

    showQuestion();

}

// -------------------
// 버튼
// -------------------

document.getElementById("submitBtn").onclick=submit;

document.getElementById("nextBtn").onclick=next;

document.getElementById("speakBtn").onclick=function(){

    speak(questions[current].question);

};

// -------------------
// Enter
// -------------------

document.getElementById("answer").addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        if(answered){

            next();

        }else{

            submit();

        }

    }

});

// 첫 문제

randomQuestion();

showQuestion();

</script>
